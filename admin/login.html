<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | Program Studi Hukum — UMP</title>
<meta name="description" content="Website resmi Program Studi Hukum Universitas Muhammadiyah Papua.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { navy: '#0B1F3A', royal: '#2A4E9E', gold: '#C9A227', bg: '#E8ECF1' },
        fontFamily: { sans: ['Inter','sans-serif'], display: ['Poppins','sans-serif'] },
      }
    }
  }
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/css/style.css">

</head>

<body x-data="{ ...themeStore(), showPass:false, loading:false,
    form: { email:'', password:'', remember:false },
    submit() {
      if(!this.form.email || !this.form.password){ NeuAlert.error('Mohon isi Username/Email dan Password.'); return; }
      this.loading = true;
      setTimeout(() => { this.loading = false; window.location.href = 'dashboard.html'; }, 700);
    }
  }" class="font-sans min-h-screen flex items-center justify-center px-4 relative overflow-hidden">

  <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-royal/10 blur-3xl"></div>
  <div class="absolute -bottom-24 -left-24 w-96 h-96 rounded-full bg-gold/10 blur-3xl"></div>

  <button @click="toggle()" class="neu-btn w-11 h-11 flex items-center justify-center absolute top-6 right-6" aria-label="Ganti mode gelap/terang">
    <svg x-show="!dark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    <svg x-show="dark" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
  </button>

  <div class="w-full max-w-md relative">
    <div class="text-center mb-8">
      <div class="w-16 h-16 neu-raised flex items-center justify-center mx-auto mb-4">
        <span class="font-display font-bold text-navy dark:text-white text-xl">UMP</span>
      </div>
      <h1 class="font-display font-semibold text-2xl text-navy dark:text-white">Admin Program Studi Hukum</h1>
      <p class="text-sm text-text-muted mt-1">Masuk untuk mengelola konten website</p>
    </div>

    <form @submit.prevent="submit()" class="neu-raised p-8 space-y-5">
      <div>
        <label class="text-xs font-semibold text-text-muted mb-2 block">Username / Email</label>
        <input x-model="form.email" type="text" placeholder="admin@ump.ac.id" class="neu-input w-full" required>
      </div>
      <div>
        <label class="text-xs font-semibold text-text-muted mb-2 block">Password</label>
        <div class="relative">
          <input x-model="form.password" :type="showPass ? 'text' : 'password'" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" class="neu-input w-full pr-11" required>
          <button type="button" @click="showPass = !showPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted" aria-label="Tampilkan password">
            <svg x-show="!showPass" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            <svg x-show="showPass" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"/></svg>
          </button>
        </div>
      </div>
      <div class="flex items-center justify-between text-xs">
        <label class="flex items-center gap-2 text-text-muted">
          <input x-model="form.remember" type="checkbox" class="rounded">
          Remember Me
        </label>
        <a href="#" class="text-royal font-medium">Lupa Password?</a>
      </div>
      <button type="submit" :disabled="loading" class="neu-btn-primary w-full py-3.5 rounded-xl">
        <span x-show="!loading">Login</span>
        <span x-show="loading">Memproses...</span>
      </button>
    </form>

    <p class="text-center text-xs text-text-muted mt-6">
      <a href="../index.html" class="text-royal font-medium">&larr; Kembali ke Website</a>
    </p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../assets/js/app.js"></script>
</body>
</html>
